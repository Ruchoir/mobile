name: Release

# The phone apps, released on a tag `vX.Y.Z` only (AGENTS.md, "Releasing"). The tag must match
# `version` in app.config.ts.
#
# - iPhone: GitHub's macOS runner builds the Release configuration, Apple signs it at export through
#   the App Store Connect API key, and it goes to TestFlight (internal testing).
# - Android: a release APK signed with Ruchoir's upload key, its checksum signed with the release GPG
#   key, published on ruchoir.com/android (no Play Store for now).
#
# The repository is private and its Actions have no minutes for now: this workflow is written to run
# once billing or a self-hosted runner exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: read

env:
  # The Expo CLI reports anonymous usage by default; Ruchoir never sends it.
  EXPO_NO_TELEMETRY: "1"
  # The build number Apple and Google see, read by app.config.ts: each run is above the last.
  RUCHOIR_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  version:
    name: Tag matches the app's version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Compare
        run: |
          app=$(sed -n 's/^ *version: "\(.*\)",$/\1/p' app.config.ts | head -1)
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version \"$app\" in app.config.ts."
            exit 1
          fi

  ios:
    name: iPhone (TestFlight)
    needs: version
    runs-on: macos-26
    timeout-minutes: 90
    # Never one cancelled half way through an upload.
    concurrency:
      group: release-ios
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Select Xcode 26
        # Apple requires the iOS 26 SDK. The newest Xcode 26 on the image, by version.
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_26*.app | grep -E '/Xcode_26(\.[0-9]+)*\.app$' | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@ruchoir"
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ]; then
            echo "::error::The APPLE_* secrets are missing: see AGENTS.md, \"Releasing\"."
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
      - name: Check the App Store Connect key
        # A minute instead of the whole build to learn that a secret is wrong.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.ruchoir.app
        run: KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8" node .github/scripts/check-app-store-key.mjs
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Generate the native project
        # Also installs the CocoaPods. The team id names who the extensions are made for.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx expo prebuild --platform ios
      - name: Archive
        # Unsigned: Xcode's automatic signing would ask for a development profile, which Apple only
        # makes for a team with a registered device, and the team has none.
        working-directory: ios
        run: |
          xcodebuild archive -quiet \
            -workspace Ruchoir.xcworkspace -scheme Ruchoir -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ruchoir.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
      - name: Sign ad hoc
        # The export re-signs everything for the App Store, but it takes the entitlements from the
        # signature it finds: an unsigned app would lose them. Xcode did not sign, so it did not
        # expand `$(AppIdentifierPrefix)` either: done here with the team id. Nested code first (the
        # frameworks, then each extension with its own entitlements), the app last.
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="$RUNNER_TEMP/Ruchoir.xcarchive/Products/Applications/Ruchoir.app"
          expand() { sed "s/\$(AppIdentifierPrefix)/$TEAM_ID./g" "$1" > "$2"; }
          sign_frameworks() {
            if [ -d "$1/Frameworks" ]; then
              find "$1/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
                -exec codesign --force --sign - {} \;
            fi
          }
          sign_frameworks "$app"
          if [ -d "$app/PlugIns" ]; then
            for extension in "$app"/PlugIns/*.appex; do
              name=$(basename "$extension" .appex)
              sign_frameworks "$extension"
              expand "ios/.targets/$name/generated.entitlements" "$RUNNER_TEMP/$name.entitlements"
              codesign --force --sign - --entitlements "$RUNNER_TEMP/$name.entitlements" "$extension"
            done
          fi
          expand ios/Ruchoir/Ruchoir.entitlements "$RUNNER_TEMP/Ruchoir.entitlements"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/Ruchoir.entitlements" "$app"
          codesign -d --entitlements - "$app"
      - name: Register the bundle ids
        # The app and its extensions, and the push capability, known to Apple before the export
        # asks for their profiles.
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8" node .github/scripts/register-app-ids.mjs
      - name: Sign for the App Store
        # Apple creates and keeps the distribution certificate itself (cloud signing): nothing to
        # store here but the API key. The upload is a step of its own: Xcode's content delivery
        # service refused the team key that the API accepts.
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ruchoir.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -l "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        # Through the App Store Connect API's build uploads, with the same key.
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.ruchoir.app
        run: |
          plist="$RUNNER_TEMP/Ruchoir.xcarchive/Products/Applications/Ruchoir.app/Info.plist"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$plist") \
          BUILD_NUMBER=$(plutil -extract CFBundleVersion raw "$plist") \
          IPA_PATH="$RUNNER_TEMP/export/Ruchoir.ipa" \
          KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8" \
            node .github/scripts/upload-to-app-store.mjs
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  android:
    name: Android (signed APK)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Java
        # React Native's Gradle plugin asks for the Java 17 toolchain.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@ruchoir"
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: The Firebase project's file
        # What Android needs to receive pushes; without it the app builds and simply cannot be
        # reached by notifications.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret: this APK will not receive notifications."
          fi
      - name: Write the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_* secrets are missing: see AGENTS.md, \"Releasing\"."
            exit 1
          fi
          (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks")
      - name: Generate the native project
        run: npx expo prebuild --platform android
      - name: Build the signed APK
        # The Android Gradle plugin's injected signing properties replace the debug key the generated
        # project signs its release with. Every processor Android phones use.
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
      - name: Check the signature
        # The APK must be signed with Ruchoir's key, never the generated project's debug key, or an
        # installed app would refuse the next update.
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if [ -n "$ANDROID_CERT_SHA256" ]; then
            grep -qi "SHA-256 digest: $ANDROID_CERT_SHA256" "$RUNNER_TEMP/certs.txt" \
              || { echo "::error::The APK is not signed with the expected certificate."; exit 1; }
          fi
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ruchoir-android
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

  publish-android:
    name: Publish (ruchoir.com/android)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Fetch the APK
        uses: actions/download-artifact@v4
        with:
          name: ruchoir-android
          path: gathered
      - name: Name the release's files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          mv gathered/app-release.apk "dist/ruchoir-$version.apk"
          size=$(stat -c %s "dist/ruchoir-$version.apk")
          printf '{\n  "version": "%s",\n  "pub_date": "%s",\n  "apk": { "path": "v%s/ruchoir-%s.apk", "bytes": %s }\n}\n' \
            "$version" "$(date -u +%FT%TZ)" "$version" "$version" "$size" > dist/latest.json
          cat dist/latest.json
      - name: Sign the checksum
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$RELEASE_GPG_KEY" | gpg --batch --import
          printf '%s' "$RELEASE_GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          cd dist
          sha256sum ./*.apk | sed 's#\./##' > SHA256SUMS.txt
          gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          rm -rf "$GNUPGHOME"
      - name: Publish through the deploy account
        # The key is bound on the server to release/android-publish-entry: it can place a release
        # and do nothing else.
        env:
          ANDROID_DEPLOY_SSH_KEY: ${{ secrets.ANDROID_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ANDROID_DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -cf release.tar -C dist .
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "deploy@$DEPLOY_HOST" \
            "$GITHUB_REF_NAME" < release.tar
          rm -f ~/.ssh/deploy
